<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F7F2E9}a{color:#211D19}a:hover{color:#4E6B52}</style>
</helmet>
<div style="width:390px;height:844px;background:#F7F2E9;background-image:radial-gradient(rgba(33,29,25,0.06) 1px, transparent 1px);background-size:24px 24px;color:#211D19;font-family:'Instrument Sans',sans-serif;box-sizing:border-box;padding:20px 16px 24px;display:flex;flex-direction:column;overflow:hidden">
  <div style="display:flex;justify-content:space-between;align-items:center;min-height:44px">
    <a href="#" style="text-decoration:none;font-size:14px;font-weight:600;padding:10px 10px 10px 0">← Hoje</a>
    <span style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#4E6B52">Lógica · nº 214</span>
    <span style="font-family:'Fraunces',serif;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums">04:32</span>
  </div>
  <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:baseline">
    <span style="font-family:'Fraunces',serif;font-size:34px;font-weight:550;line-height:1">Binairo</span>
    <span style="font-size:13px;color:#6E6659;font-variant-numeric:tabular-nums">{{ filled }} de 64</span>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center">
    <div style="background:#FBF7EF;border:1px solid #D8D0C2;border-radius:6px;box-shadow:5px 5px 0 rgba(78,107,82,0.2);padding:10px;transform:rotate(0.4deg)">
      <div style="display:grid;grid-template-columns:repeat(8, 38px);grid-auto-rows:38px;gap:3px">
        <sc-for list="{{ cells }}" as="c" hint-placeholder-count="64">
          <div style="background:{{ c.bg }};border:1.5px solid {{ c.line }};border-radius:5px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:18px;font-variant-numeric:tabular-nums;color:{{ c.color }};font-weight:{{ c.weight }}">{{ c.t }}</div>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:10px">
    <a href="#" style="flex:1.4;height:60px;display:flex;align-items:center;justify-content:center;background:#FBF7EF;border:1.5px solid #4E6B52;border-radius:6px;box-shadow:3px 3px 0 rgba(78,107,82,0.22);font-family:'Fraunces',serif;font-size:26px;text-decoration:none;color:#4E6B52;font-weight:600">0</a>
    <a href="#" style="flex:1.4;height:60px;display:flex;align-items:center;justify-content:center;background:#FBF7EF;border:1.5px solid #4E6B52;border-radius:6px;box-shadow:3px 3px 0 rgba(78,107,82,0.22);font-family:'Fraunces',serif;font-size:26px;text-decoration:none;color:#4E6B52;font-weight:600">1</a>
    <a href="#" style="flex:1;height:60px;display:flex;align-items:center;justify-content:center;background:#FBF7EF;border:1.5px solid #D8D0C2;border-radius:6px;box-shadow:3px 3px 0 rgba(33,29,25,0.1);font-size:14px;text-decoration:none;color:#6E6659">apagar</a>
  </div>
  <a href="#" style="margin-top:14px;height:50px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px;font-weight:600;color:#F7F2E9;background:#4E6B52;border-radius:6px;box-shadow:3px 3px 0 rgba(78,107,82,0.25)">Usar dica — 1 disponível</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const rows = ["01.0.ii.","i.0.1o.1",".o110.i0","1io..10.","0.io1..i",".1.i0o1.","i0o.1.0i","..10.i.o"];
    const cells = []; let filled = 0;
    for (const r of rows) for (const ch of r) {
      if (ch === '.') { cells.push({t:'', color:'#211D19', weight:400, bg:'#F7F2E9', line:'#D8D0C2'}); continue; }
      filled++;
      if (ch === '0' || ch === '1') cells.push({t:ch, color:'#211D19', weight:600, bg:'#F1EADD', line:'#D8D0C2'});
      else cells.push({t: ch === 'o' ? '0' : '1', color:'#4E6B52', weight:500, bg:'#F7F2E9', line:'rgba(78,107,82,0.5)'});
    }
    return { cells, filled };
  }
}
</script>
</body>
</html>
