name: Impeccable

permissions:
  contents: read

on:
  deployment_status:

jobs:
  detect:
    # Only successful web previews. Environment string uses an EN DASH (U+2013),
    # exactly as vercel[bot] creates it: "Preview – miolos-web". Production
    # deployments ("Production – …") and the api project are filtered out here.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview – miolos-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # For deployment_status, GITHUB_SHA is the deployed commit (GitHub docs),
        # so the default checkout gives us the PR's own .impeccable/config.json.
      - name: preflight — assert every scanned route reachable through bypass
        id: preflight
        # Guards the gate's proven silent-green paths: impeccable detect exits 0
        # on an empty or unreachable URL, and a rotated/empty secret would scan
        # the Vercel SSO page instead of the app. Fail loudly on all of them
        # BEFORE paying for install + Chrome. Host is allowlisted to *.vercel.app
        # before the secret is ever appended to an event-supplied URL.
        # Masking note: Actions masks the secret verbatim; Vercel bypass secrets
        # are alphanumeric so URL-encoding is the identity transformation. If the
        # secret format ever gains URL-encodable characters, re-check that the
        # encoded variant cannot leak unmasked in logs.
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "deployment_status.target_url is empty — refusing to scan"; exit 1; }
          test -n "$BYPASS" || { echo "VERCEL_AUTOMATION_BYPASS_SECRET is empty — refusing to scan"; exit 1; }
          host="${DEPLOYMENT_URL#https://}"; host="${host%%[/?#]*}"
          case "$host" in
            *[!a-zA-Z0-9.-]*) echo "target_url host contains forbidden characters — refusing to append the bypass secret"; exit 1 ;;
          esac
          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *) echo "target_url is not https — refusing to append the bypass secret"; exit 1 ;;
          esac
          case "$host" in
            *.vercel.app) ;;
            *) echo "target_url host is not *.vercel.app — refusing to append the bypass secret"; exit 1 ;;
          esac
          # Same bypass mechanism detect uses: query params + cookie. The flow is
          # 302 + Set-Cookie back to the clean URL, so curl needs a cookie jar to
          # land 200 on the deployment host (verified empirically: without the
          # jar the redirect chain ends on vercel.com/login even with a valid
          # secret). Puppeteer holds cookies natively.
          jar=$(mktemp)
          # EVERY path the detect steps below scan, not just "/". Asserting the
          # root alone was itself a silent-green path: "/" reads no database,
          # while the eight game routes are db-backed — so a missing, rotated or
          # unmigrated DATABASE_URL let the preflight pass and the scanner then
          # found nothing on a Next 500 page and exited 0. ADR-0028's
          # Consequences name that risk verbatim; this loop is what turns it
          # from a human curl into a machine gate (step 6 finding
          # impeccable-preflight-does-not-cover-the-two-db-backed-urls-it-added).
          # Keep this list and the two detect invocations below in step.
          #
          # #31 (ADR-0053 decision 12): this list holds LITERAL paths only. The
          # archive's month, day and play URLs are dates, so they are
          # DISCOVERED from the app's own HTML after the loop and handed to the
          # detect steps through `env:` — see the discovery block below.
          #
          # A 200 is NOT the property that matters, and on a db-backed route it
          # is the failure mode: with no published puzzle for today, /sudoku
          # renders the "ainda não chegou" card at HTTP 200 and detect would
          # scan that instead of the Sudoku screen and pass green (plan 018
          # §12.8). So each game route also has to prove it rendered the thing
          # we are about to scan, through the data attribute its own view sets
          # (play-view.tsx / conclusion-view.tsx). "/" needs no marker: it reads
          # no database, so reachable and rendered are the same property there.
          status=0
          for path in "/" "/binairo" "/binairo/concluido" "/sudoku" "/sudoku/concluido" "/nonogram" "/nonogram/concluido" "/termo" "/termo/concluido" "/modo-livre" "/modo-livre/binairo" "/modo-livre/sudoku" "/modo-livre/nonogram" "/privacidade" "/termos" "/vincular" "/estatisticas" "/arquivo"; do
            case "$path" in
              */concluido) marker='data-conclusion-state=' ;;
              # The free-play index (#28) is static and carries its own
              # marker; the three /modo-livre/<game> paths fall through to
              # the data-play-state arm below — their static shell is the
              # generating skeleton, which sets it (ADR-0046).
              "/modo-livre") marker='data-free-play=' ;;
              # The #21 pages (policy + magic-link landing) and #29's
              # stats screen carry the data-page marker; /vincular without
              # a token renders its missing-token explainer, marker
              # included, and /estatisticas is static — its aggregates
              # arrive client-side, so the marker is in the shell.
              # #31's archive index carries data-page too. Its three
              # DATE-BEARING descendants are not in this list and cannot be:
              # nobody can hardcode a date without inviting drift, a 404 or a
              # vacuous green. They are DISCOVERED below, from the app's own
              # HTML, and they carry data-page= (month, day) and
              # data-play-state= (a play route) respectively.
              # #158's /termos is the /privacidade shape: static, data-page.
              "/privacidade"|"/termos"|"/vincular"|"/estatisticas"|"/arquivo") marker='data-page=' ;;
              "/") marker='' ;;
              *) marker='data-play-state=' ;;
            esac
            body=$(mktemp)
            # `|| true` because the job shell runs with `-e`: a connection
            # failure would otherwise abort the loop before the other paths are
            # reported. curl still writes "000 <url>" through -w, which the case
            # below rejects, so nothing can pass by failing to connect.
            code_and_url=$(curl -sSL -c "$jar" -b "$jar" -o "$body" -w '%{http_code} %{url_effective}' \
              "$DEPLOYMENT_URL$path?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true") || true
            echo "preflight $path: $code_and_url"
            # All paths are reported before failing: one round-trip tells us
            # whether the whole preview is down or only the db-backed routes.
            case "$code_and_url" in
              "200 $DEPLOYMENT_URL"*) ;;
              *) echo "preview not reachable through bypass at $path (need HTTP 200 on the deployment host) — refusing to scan"; status=1 ;;
            esac
            # The body is only ever grepped, never echoed: it is fetched with
            # the bypass secret in the query string and printing it would put
            # the response in the log. #31 narrows that rule rather than
            # breaking it: a PATH extracted from a body may be echoed and
            # exported, a URL may not — a URL carries the secret.
            if [ -n "$marker" ] && ! grep -q "$marker" "$body"; then
              echo "preflight $path: no $marker in the response — the screen we are about to scan did not render (no published puzzle for today, or a db-backed failure) — refusing to scan"
              status=1
            fi
            rm -f "$body"
          done
          # ——— #31: DISCOVER the date-bearing archive URLs (ADR-0053 decision 12)
          # The archive's month, day and play URLs are dates, and every
          # alternative to discovery is worse in a way that matters: a
          # hardcoded date DRIFTS the moment the archive's edges move and 404s
          # forever after; a shell-computed one (`date -d yesterday`) puts a
          # CLIENT CLOCK in charge of what the São Paulo publication wall
          # published, which CLAUDE.md's own invariant forbids; and a stable
          # alias route is a second URL for one resource.
          #
          # This matches the URL GRAMMAR rather than the markup, so a restyle
          # cannot break it, and it cannot 404 — the URLs came out of a 200
          # body. Only PATHS are exported, never a URL carrying the bypass
          # secret: each detect step composes its own full URL, so no step
          # output can contain the secret.
          month_path=""; day_path=""; play_path=""
          fetch_path() {
            curl -sSL -c "$jar" -b "$jar" -o "$2" -w '%{http_code}' \
              "$DEPLOYMENT_URL$1?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true" || true
          }
          index_body=$(mktemp)
          fetch_path "/arquivo" "$index_body" >/dev/null
          # The body is only ever grepped, never echoed — it is fetched with
          # the bypass secret in the query string. A PATH extracted from it may
          # be echoed; a URL may not.
          month_path=$(grep -oE '/arquivo/mes/[0-9]{4}-[0-9]{2}' "$index_body" | head -n 1 || true)
          rm -f "$index_body"
          if [ -z "$month_path" ]; then
            # An EMPTY ARCHIVE IS A SKIP, NOT A RED. This job fires on every
            # preview deployment for every PR, so redding here would block the
            # gate repo-wide on unrelated work until production has a strictly
            # past published day. `/arquivo` itself is still asserted 200 +
            # marker above, unconditionally, so the index can never silently
            # disappear.
            echo "preflight: /arquivo lists no month — the archive is empty, skipping the date-bearing scans"
          else
            # Re-validated against its own anchored grammar before use: the
            # source is the deployment's own HTML.
            case "$month_path" in
              /arquivo/mes/[0-9][0-9][0-9][0-9]-[0-9][0-9]) ;;
              *) echo "preflight: discovered month path failed its grammar — refusing to scan"; exit 1 ;;
            esac
            month_body=$(mktemp)
            month_code=$(fetch_path "$month_path" "$month_body")
            test "$month_code" = "200" || { echo "preflight $month_path: $month_code — refusing to scan"; exit 1; }
            grep -q 'data-page=' "$month_body" || { echo "preflight $month_path: no data-page= — refusing to scan"; exit 1; }
            echo "preflight $month_path: 200 + data-page= (discovered)"
            day_path=$(grep -oE '/arquivo/[0-9]{4}-[0-9]{2}-[0-9]{2}' "$month_body" | head -n 1 || true)
            rm -f "$month_body"
            test -n "$day_path" || { echo "preflight: $month_path lists no day — refusing to scan"; exit 1; }
            case "$day_path" in
              /arquivo/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
              *) echo "preflight: discovered day path failed its grammar — refusing to scan"; exit 1 ;;
            esac
            day_body=$(mktemp)
            day_code=$(fetch_path "$day_path" "$day_body")
            test "$day_code" = "200" || { echo "preflight $day_path: $day_code — refusing to scan"; exit 1; }
            grep -q 'data-page=' "$day_body" || { echo "preflight $day_path: no data-page= — refusing to scan"; exit 1; }
            echo "preflight $day_path: 200 + data-page= (discovered)"
            play_path=$(grep -oE '/arquivo/[0-9]{4}-[0-9]{2}-[0-9]{2}/(binairo|nonogram|sudoku|termo)' "$day_body" | head -n 1 || true)
            rm -f "$day_body"
            test -n "$play_path" || { echo "preflight: $day_path lists no game — refusing to scan"; exit 1; }
            case "$play_path" in
              /arquivo/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/binairo|\
              /arquivo/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/nonogram|\
              /arquivo/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/sudoku|\
              /arquivo/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/termo) ;;
              *) echo "preflight: discovered play path failed its grammar — refusing to scan"; exit 1 ;;
            esac
            play_body=$(mktemp)
            play_code=$(fetch_path "$play_path" "$play_body")
            test "$play_code" = "200" || { echo "preflight $play_path: $play_code — refusing to scan"; exit 1; }
            grep -q 'data-play-state=' "$play_body" || { echo "preflight $play_path: no data-play-state= — refusing to scan"; exit 1; }
            echo "preflight $play_path: 200 + data-play-state= (discovered)"
            rm -f "$play_body"
          fi
          # Heredoc delimiters, so a value can never be mistaken for a new
          # output line. The three may be EMPTY (the skip above), and both
          # detect steps then scan their fixed lists only.
          { echo "month_path<<EOF"; echo "$month_path"; echo EOF; } >> "$GITHUB_OUTPUT"
          { echo "day_path<<EOF"; echo "$day_path"; echo EOF; } >> "$GITHUB_OUTPUT"
          { echo "play_path<<EOF"; echo "$play_path"; echo EOF; } >> "$GITHUB_OUTPUT"
          rm -f "$jar"
          test "$status" -eq 0 || exit 1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 — version comes from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: chrome-cache
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          # Any lockfile change busts the exact key, but Chrome only actually
          # changes on a puppeteer bump — the prefix restore plus puppeteer's
          # idempotent install makes unrelated-dependency busts near-free.
          restore-keys: |
            puppeteer-chrome-${{ runner.os }}-
      - run: pnpm exec puppeteer browsers install chrome
      # Save immediately after install (not as a post step) so a red detect run —
      # the hot path during a fix loop — still leaves the cache warm.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ steps.chrome-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: impeccable detect — desktop 1440x900
        # detect takes a POSITIONAL URL LIST and does not crawl: every screen
        # that must be scanned is named here, in BOTH viewport steps, and every
        # URL carries its own bypass query string (the cookie is set by the
        # first one, but a scan that starts on a 401 would silently pass — the
        # preflight comment above records why detect exiting 0 is not evidence).
        # Same masking properties as the preflight: the secret is only ever
        # appended to a host already allowlisted to *.vercel.app there.
        id: desktop
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # #31: the discovered archive paths reach this step through `env:`,
          # NEVER by `${{ }}` interpolation inside the `run:` string below —
          # that would be textual substitution of a value read out of a fetched
          # HTML body into a shell command, an Actions expression-injection
          # shape. Empty when the archive is empty, and `composeArchiveUrls`
          # below then contributes nothing.
          ARCHIVE_MONTH_PATH: ${{ steps.preflight.outputs.month_path }}
          ARCHIVE_DAY_PATH: ${{ steps.preflight.outputs.day_path }}
          ARCHIVE_PLAY_PATH: ${{ steps.preflight.outputs.play_path }}
        run: >-
          pnpm exec impeccable detect
          "$DEPLOYMENT_URL/?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/binairo?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/binairo/concluido?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/sudoku?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/sudoku/concluido?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/nonogram?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/nonogram/concluido?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/termo?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/termo/concluido?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/modo-livre?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/modo-livre/binairo?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/modo-livre/sudoku?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/modo-livre/nonogram?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/privacidade?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/termos?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/vincular?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/estatisticas?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/arquivo?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          ${ARCHIVE_MONTH_PATH:+"$DEPLOYMENT_URL$ARCHIVE_MONTH_PATH?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"}
          ${ARCHIVE_DAY_PATH:+"$DEPLOYMENT_URL$ARCHIVE_DAY_PATH?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"}
          ${ARCHIVE_PLAY_PATH:+"$DEPLOYMENT_URL$ARCHIVE_PLAY_PATH?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"}
          --viewport 1440x900
      - name: impeccable detect — mobile 390x844
        # Run even when desktop found regressions (one round-trip shows both
        # viewports' findings), but only if desktop actually started — a
        # preflight/setup failure must not reach a detect invocation.
        if: ${{ !cancelled() && steps.desktop.outcome != 'skipped' }}
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # #31: the discovered archive paths reach this step through `env:`,
          # NEVER by `${{ }}` interpolation inside the `run:` string below —
          # that would be textual substitution of a value read out of a fetched
          # HTML body into a shell command, an Actions expression-injection
          # shape. Empty when the archive is empty, and `composeArchiveUrls`
          # below then contributes nothing.
          ARCHIVE_MONTH_PATH: ${{ steps.preflight.outputs.month_path }}
          ARCHIVE_DAY_PATH: ${{ steps.preflight.outputs.day_path }}
          ARCHIVE_PLAY_PATH: ${{ steps.preflight.outputs.play_path }}
        run: >-
          pnpm exec impeccable detect
          "$DEPLOYMENT_URL/?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/binairo?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/binairo/concluido?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/sudoku?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/sudoku/concluido?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/nonogram?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/nonogram/concluido?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/termo?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/termo/concluido?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/modo-livre?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/modo-livre/binairo?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/modo-livre/sudoku?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/modo-livre/nonogram?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/privacidade?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/termos?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/vincular?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/estatisticas?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          "$DEPLOYMENT_URL/arquivo?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"
          ${ARCHIVE_MONTH_PATH:+"$DEPLOYMENT_URL$ARCHIVE_MONTH_PATH?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"}
          ${ARCHIVE_DAY_PATH:+"$DEPLOYMENT_URL$ARCHIVE_DAY_PATH?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"}
          ${ARCHIVE_PLAY_PATH:+"$DEPLOYMENT_URL$ARCHIVE_PLAY_PATH?x-vercel-protection-bypass=$BYPASS&x-vercel-set-bypass-cookie=true"}
          --viewport 390x844
