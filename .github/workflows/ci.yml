name: CI
permissions:
  contents: read
on:
  # `push: [main]` deliberately absent. Every commit reaching main arrives
  # through a squash merge, and the `protect-main` ruleset requires the `gate`
  # check (integration 15368) on the PR before that merge is allowed — so a
  # push-triggered run only ever re-proved, on the same tree, what the PR had
  # already proved minutes earlier. It gated nothing: with `pull_request` as
  # the sole trigger the required context is still produced on every PR.
  # The signal genuinely given up is "CI green on main post-merge", which past
  # handoffs cite as evidence; a squash merge can differ from the PR head when
  # main moved underneath it, and that gap is now caught on the next PR rather
  # than immediately.
  pull_request:

# Supersession: pushing a new commit to a PR makes the older run's verdict
# irrelevant, so stop paying for a gate nobody will read. The key is
# `github.ref`, which for `pull_request` is `refs/pull/<n>/merge` — unique per
# PR, so two different PRs can never cancel each other.
#
# This changes WHEN the gate runs, never WHAT it checks: a cancelled run leaves
# `gate` in a non-success state, so the ruleset keeps blocking the merge until
# the newest run passes on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # No `env:` block, and deliberately so. This job previously carried
    # TURBO_TOKEN/TURBO_TEAM for the Vercel Remote Cache; the turbo artifact
    # cache is now carried by actions/cache instead (see the restore step
    # below), which needs no credential at all. That is the whole point: a
    # bearer token exported into the gate's environment is readable by every
    # process the job starts, so any compromised dependency reached by
    # `pnpm install`, `test` or `build` could exfiltrate it. Removing the
    # secret removes the class.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 — version comes from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # turbo's filesystem cache. `.turbo/cache` at the repo root is the whole
      # artifact store on turbo 2.10.8 — verified, not assumed: with every
      # `.turbo` directory deleted, one `pnpm typecheck` recreated the root
      # `.turbo/cache` plus per-package `.turbo/*.log` files, and after
      # deleting the per-package ones and leaving only `.turbo/cache`, the
      # rerun reported "6 cached, 6 total >>> FULL TURBO". The logs live inside
      # the cached tarballs and are replayed from them, so this one path is
      # sufficient. It covers typecheck, test and build; `lint` is a root
      # eslint script outside turbo and is unaffected either way.
      #
      # The key carries github.sha because Actions cache entries are immutable
      # — an existing key can never be overwritten. Keyed on the lockfile hash
      # alone, the very first run would save and every later run would hit that
      # exact key and save nothing, freezing the cache at its first contents
      # forever. A per-commit key means every run writes a fresh, strictly
      # larger cache and `restore-keys` picks the newest matching prefix:
      # first any cache built against this same lockfile, then any cache at all
      # for this OS. A partial hit is still most of the win, because turbo
      # keys each task by its own inputs — unchanged packages replay even when
      # the commit that produced the cache touched something else.
      #
      # What this gives up against the remote cache it replaces, stated plainly:
      # Actions caches are branch-scoped. A run can read its own branch's
      # caches and the default branch's, never another PR's. Because this
      # workflow triggers on `pull_request` only — no `push: [main]`, see the
      # comment at the top — nothing ever writes a cache under main's scope, so
      # there is no shared baseline and every PR's FIRST run is cold. Warmth is
      # per-PR: it accrues across pushes to the same PR, which is the fix loop
      # and the common case. The Vercel remote cache was shared across every
      # branch and every machine; that sharing is the price of not holding the
      # token, and it is not bought back by re-adding a main trigger.
      #
      # Degrades gracefully by construction: a cold cache is a normal full run.
      # Nothing here can fail the gate — a miss costs time, never a red check.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - run: pnpm typecheck
      - run: pnpm lint
      # The root `test` script caps turbo at 2 (ADR-0057). That cap is a fix for
      # a 15.5 GB / 8-core developer box, where vitest spawns `cpus-1` workers
      # per package and six packages at once demand ~19 GB — measured peak RSS
      # 15 484 MB, MemAvailable floor 135 MB, swap 1 348 MB. This runner has
      # neither problem: on its 2 vCPUs vitest's own maxWorkers collapses to 1,
      # so six packages demand ~2.7 GB and there is no oversubscription to
      # relieve. Capping here would cost ~+55 % (gate run 31888933252: 1021.2 s
      # of per-package work inside a 330 s step; a two-lane makespan floor is
      # max(1021.2/2, 325.6) ~= 510 s) to buy nothing.
      #
      # Passing the flag explicitly also keeps CI the ONE runner that still
      # executes the suite at the fan-out ADR-0055's budgets were anchored on.
      # This is behaviourally identical to the bare `pnpm test` that ran here
      # before ADR-0057 — it pins the existing configuration, it does not
      # introduce a new one. A runner upgrade (more vCPUs, a larger-runner
      # label, or the repo going public) multiplies `cpus-1` and re-opens #114
      # here, where nothing is capped: that residual is named in ADR-0057.
      #
      # MIOLOS_TEST_DB_TIMING makes the PGlite boot report its own cost, which
      # is what discharges ADR-0055 decision 4's CI re-read for `createTestDb`
      # (vitest prints no hook durations in any reporter). It reaches the
      # workers only because `turbo.json`'s test task declares it under `env`.
      - run: nproc && free -m
      - run: MIOLOS_TEST_DB_TIMING=1 pnpm test --concurrency=10
      - run: pnpm build
      # Split restore/save rather than the unified `actions/cache`, matching
      # the puppeteer cache in impeccable.yml. The unified action saves in a
      # post step that is skipped when the job fails; `save-always` existed to
      # patch that and is deprecated in favour of exactly this split. The
      # failing run is the one whose cache matters most — a red gate is the
      # start of a fix loop, and the next push should replay everything that
      # was already green rather than re-proving it.
      #
      # `!cancelled()` and not `always()`: the concurrency group above cancels
      # superseded runs, and paying an upload for a run nobody will read is the
      # cost this whole file exists to avoid. The hashFiles guard keeps the
      # step quiet when the job died before any turbo task ran and there is
      # therefore no `.turbo/cache` to upload.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ !cancelled() && hashFiles('.turbo/cache/**') != '' }}
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
