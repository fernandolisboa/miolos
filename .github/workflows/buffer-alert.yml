# Buffer-depth alerting (issue #17 AC 3): reads the DB-derived depth via
# the public /buffer-depth endpoint — never cron exit codes — and pages
# by opening/bumping a `buffer-alert` GitHub issue (the notification
# channel for a solo phone-driven operator). Zero marketplace actions on
# purpose: nothing to SHA-pin (#41 convention satisfied by construction);
# curl/jq/gh are preinstalled on ubuntu-latest and gh works checkout-free.
# It also opens `answer-list-alert` when Termo's answer list runs low: see ADR-0084.
name: Buffer alert
permissions:
  issues: write
on:
  schedule:
    # After the 06:00-06:59 UTC publish-cron window (Hobby-plan jitter).
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      force_shallow:
        description: "Treat the response as shallow regardless of the flag (end-to-end alert drill)"
        type: boolean
        default: false
      force_answer_list_low:
        description: "Treat the Termo answer list as low regardless of the flag (end-to-end alert drill)"
        type: boolean
        default: false
concurrency: buffer-alert
env:
  API_ORIGIN: https://api.miolos.app
  REPO: fernandolisboa/miolos
jobs:
  check-depth:
    runs-on: ubuntu-latest
    steps:
      - name: Read buffer depth
        # -fsS: an HTTP error fails the job — a red scheduled run is
        # itself a notification.
        run: |
          raw="$(curl -fsS "$API_ORIGIN/buffer-depth")"
          # GITHUB_ENV is line-oriented: a newline in the body would smuggle
          # extra NAME=value lines into later steps (env-var injection from
          # the polled endpoint). jq re-serializes the FIRST JSON document
          # onto exactly one line and fails the job on non-JSON, so only
          # validated compact JSON is ever persisted.
          body="$(printf '%s' "$raw" | jq -cen 'input')"
          echo "buffer-depth response: $body"
          printf '%s' "$body" | jq -e '(.shallow | type) == "boolean" and (.termoAnswersLow | type) == "boolean" and (.termoAnswersRemaining | type) == "number"' > /dev/null
          echo "BODY=$body" >> "$GITHUB_ENV"
          # `jq -r` unescapes, so a string value carrying \n would write a
          # second NAME=value line. Each flag goes through a form that can
          # only print `true` or `false`.
          echo "SHALLOW=$(printf '%s' "$body" | jq -r 'if .shallow == true then "true" else "false" end')" >> "$GITHUB_ENV"
          echo "ANSWER_LIST_LOW=$(printf '%s' "$body" | jq -r 'if .termoAnswersLow == true then "true" else "false" end')" >> "$GITHUB_ENV"
      - name: Open or bump the alert issues
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_SHALLOW: ${{ inputs.force_shallow == true }}
          FORCE_ANSWER_LIST_LOW: ${{ inputs.force_answer_list_low == true }}
        run: |
          # Called in `||` context, where bash -e is off: every command
          # returns on failure itself, so one stream failing cannot skip
          # the other or dedupe on an empty list.
          open_or_bump() {
            local existing
            existing="$(gh issue list -R "$REPO" --label "$1" --state open --json number --jq '.[0].number')" || return 1
            if [ -n "$existing" ]; then
              gh issue comment "$existing" -R "$REPO" --body "$4" || return 1
            else
              gh issue create -R "$REPO" --label "$1" --title "$2" --body "$3" || return 1
            fi
          }
          status=0
          if [ "$SHALLOW" = true ] || [ "$FORCE_SHALLOW" = true ]; then
            depths="$(printf '%s' "$BODY" | jq -c .depths)"
            open_or_bump buffer-alert "Buffer shallow: $depths" "GET /buffer-depth reported: \`$BODY\`

          The daily buffer is below the effective alert threshold (or this is a forced drill run). Check the publish cron's recent runs on Vercel and docs/adr/0024 for the operational semantics." "Buffer still shallow: \`$BODY\`" || status=1
          fi
          if [ "$ANSWER_LIST_LOW" = true ] || [ "$FORCE_ANSWER_LIST_LOW" = true ]; then
            remaining="$(printf '%s' "$BODY" | jq .termoAnswersRemaining)"
            # see ADR-0084
            { gh label create answer-list-alert -R "$REPO" --color d93f0b \
                --description "Termo answer list running low (opened by the buffer-alert workflow)" --force &&
              open_or_bump answer-list-alert "Termo answer list running low: $remaining left" "The Termo answer list has $remaining unused answers left (or this is a forced drill run). Each daily spends one, and at zero Termo goes dark. Extend the list with the ADR-0015 harness (content/termo/pipeline.py, select_answers.py) in a code and content PR. This is not a cron failure. See docs/adr/0084." "Answer list still low: $remaining unused answers left."
            } || status=1
          fi
          exit "$status"
