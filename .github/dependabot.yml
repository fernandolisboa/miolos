# Keeps the SHA-pinned actions in .github/workflows fresh (follow-up to PR #42):
# Dependabot preserves pin-by-SHA and maintains the trailing `# vN` version comments.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Monthly, not weekly: each Dependabot PR costs a full ~7-minute gate run,
      # and this ecosystem is a handful of first-party actions pinned by SHA —
      # routine version drift, not a runtime dependency surface.
      #
      # Read the cost honestly: this interval governs ROUTINE drift only.
      # Dependabot alerts and security updates were enabled on this repo on
      # 2026-08-14 (`GET /repos/…/automated-security-fixes` →
      # `{"enabled": true, "paused": false}`; `/vulnerability-alerts` → 204),
      # so an advisory-driven fast path now runs alongside this schedule and
      # opens its own PR the moment an action is known-vulnerable, regardless
      # of what is set here. Monthly is right BECAUSE that fast path exists:
      # it widens the worst-case window on routine drift from ~7 to ~30 days
      # while a real advisory is no longer waiting on the cadence at all.
      # If the two settings are ever turned back off, this interval is again
      # the ONLY refresh cadence these pins have — revisit it then.
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
